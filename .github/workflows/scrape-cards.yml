name: Scrape card data

on:
  schedule:
    # Runs every 2 hours. GitHub Actions schedules run in UTC.
    # WC2026 group stage: Jun 11 – Jul 2. Knockout: Jul 4 – Jul 19.
    - cron: '0 */2 * * *'
  workflow_dispatch: # also allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape card data
        run: node scrape-cards.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git diff --cached --quiet \
            && echo "No changes to commit" \
            || (git commit -m "chore: update card data [skip ci]" && git push)
